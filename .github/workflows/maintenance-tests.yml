name: Maintenance script tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run --config vitest.tools.config.ts --coverage
